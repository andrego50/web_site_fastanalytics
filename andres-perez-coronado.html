<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andrés Pérez Coronado — el perfil se movió</title>

  <!-- El perfil del fundador ahora vive en su propio sitio, fuera de este repo.
       GitHub Pages no permite devolver un 301, así que la redirección se hace
       con meta refresh + canonical: los enlaces antiguos siguen llegando y los
       buscadores consolidan todo en el sitio personal en vez de indexar dos
       páginas del mismo perfil. -->
  <link rel="canonical" href="https://andrego50.github.io">
  <meta http-equiv="refresh" content="0; url=https://andrego50.github.io">
  <meta name="robots" content="noindex, follow">

  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg?v=2">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif;
      color: #1A1A2E;
      background: #F8F9FC;
      text-align: center;
      padding: 24px;
    }
    p { color: #4A4A6A; margin: 0 0 20px; }
    a {
      display: inline-block;
      padding: 12px 24px;
      background: #006D6D;
      color: #fff;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div>
    <p>El perfil de Andrés Pérez Coronado se movió a su sitio personal.</p>
    <a href="https://andrego50.github.io">Ir al sitio &rarr;</a>
  </div>
  <script>window.location.replace("https://andrego50.github.io");</script>
</body>
</html>
