<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronnet Show — Construcción y disrupción de redes de lavado · FastAnalytics</title>
<style>
  :root{
    --teal:#006D6D; --teal2:#0F766E; --teal3:#0D9488; --amber:#D4883A; --amber2:#B45309;
    --slate:#64748B; --bg:#071216; --bg2:#0B1C22; --panel:#0E242C; --line:#1B3A44;
    --txt:#E8F1F2; --mut:#8FA6AD;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);color:var(--txt);
    font-family:"Inter",-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100vh}
  /* ---------- top bar ---------- */
  #topbar{display:flex;align-items:center;gap:14px;padding:10px 18px;
    background:linear-gradient(180deg,#0B1C22,#0B1C2200);border-bottom:1px solid var(--line);z-index:20}
  #topbar .brand{display:flex;align-items:center;gap:10px;min-width:0}
  #topbar svg{height:26px;flex:none}
  #sceneTitle{font-size:15px;font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #sceneKicker{font-size:11px;color:var(--amber);letter-spacing:1.6px;text-transform:uppercase}
  .spacer{flex:1}
  .tbtn{background:#123038;border:1px solid var(--line);color:var(--txt);border-radius:8px;
    padding:6px 12px;font-size:12px;cursor:pointer;font-weight:600}
  .tbtn:hover{background:#1A424E}
  .tbtn.on{background:var(--teal);border-color:var(--teal)}
  /* ---------- main ---------- */
  #main{flex:1;display:flex;min-height:0}
  /* ---------- menu (portada) ---------- */
  #menu{flex:1;overflow:auto;padding:34px 44px;display:none}
  #menu.open{display:block}
  #menu h1{font-size:34px;font-weight:800;line-height:1.15;max-width:760px}
  #menu h1 .a{color:var(--amber)}
  #menu .sub{margin-top:12px;font-size:16px;color:var(--mut);max-width:720px;line-height:1.5}
  .mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:28px;max-width:1150px}
  .mcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;
    cursor:pointer;transition:.18s;position:relative}
  .mcard:hover{transform:translateY(-3px);border-color:var(--teal3)}
  .mcard .num{font-size:11px;font-weight:800;color:var(--amber);letter-spacing:1px}
  .mcard .k{font-size:10px;color:var(--teal3);text-transform:uppercase;letter-spacing:1.4px;margin-top:6px;font-weight:700}
  .mcard h3{font-size:15px;margin-top:4px;line-height:1.3}
  .mcard p{font-size:12px;color:var(--mut);margin-top:6px;line-height:1.45}
  .mcard.concepto{border-left:3px solid var(--teal3)}
  .mcard.datos{border-left:3px solid var(--amber)}
  /* ---------- stage ---------- */
  #stageWrap{flex:1;display:none;flex-direction:column;min-width:0}
  #stageWrap.open{display:flex}
  #canvasBox{flex:1;position:relative;min-height:0}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  /* ---------- simulator bar (scene D4) ---------- */
  #simbar{display:none;gap:8px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);
    background:var(--bg2);flex-wrap:wrap}
  #simbar.open{display:flex}
  #simbar .lab{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
  .sbtn{background:#123038;border:1px solid var(--line);color:var(--txt);border-radius:7px;
    padding:5px 10px;font-size:12px;cursor:pointer;font-weight:700;font-family:"JetBrains Mono",monospace}
  .sbtn.on{background:var(--amber);color:#1A1005;border-color:var(--amber)}
  /* ---------- bottom controls ---------- */
  #controls{border-top:1px solid var(--line);background:var(--bg2);padding:10px 18px 12px;z-index:20}
  #caption{font-size:16px;font-weight:600;min-height:44px;display:flex;align-items:center;line-height:1.4}
  #caption .stepno{color:var(--amber);font-family:monospace;margin-right:10px;font-size:13px}
  #ctrlRow{display:flex;align-items:center;gap:10px;margin-top:8px}
  .cbtn{width:42px;height:42px;border-radius:50%;background:var(--teal);border:none;color:#fff;
    font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
  .cbtn:hover{background:var(--teal3)}
  .cbtn.ghost{background:#123038;border:1px solid var(--line);color:var(--txt)}
  #prog{flex:1;height:8px;background:#123038;border-radius:6px;position:relative;cursor:pointer}
  #progFill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal3));border-radius:6px;width:0%}
  #progDot{position:absolute;top:-4px;width:16px;height:16px;background:var(--amber);border-radius:50%;
    transform:translateX(-8px);box-shadow:0 0 10px #D4883AAA;left:0%}
  #stepCount{font-size:12px;color:var(--mut);min-width:64px;text-align:right;font-family:monospace}
  #hints{position:absolute;top:12px;right:14px;font-size:11px;color:var(--mut);
    background:#0B1C22CC;padding:6px 10px;border-radius:8px;line-height:1.6;z-index:5}
  #chipRow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .chip{background:#123038;border:1px solid var(--line);color:var(--mut);border-radius:20px;
    padding:4px 12px;font-size:12px;cursor:pointer;font-weight:600}
  .chip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="brand">
      <!-- Logo FastAnalytics (nonagono, inline) -->
      <svg viewBox="0 0 300 52" xmlns="http://www.w3.org/2000/svg" aria-label="FastAnalytics">
        <g transform="translate(2,2)">
          <polygon points="24,1 38,5.8 45,19 42,33 32,43 16,43 6,33 3,19 10,5.8" fill="none" stroke="#0D9488" stroke-width="2.4" stroke-linejoin="round"/>
          <rect x="15" y="23" width="5.5" height="14" rx="1.8" fill="#0D9488" opacity="0.8"/>
          <rect x="21.5" y="17" width="5.5" height="20" rx="1.8" fill="#0D9488"/>
          <rect x="28" y="12" width="5.5" height="25" rx="1.8" fill="#D4883A"/>
        </g>
        <text x="58" y="30" font-family="Inter,-apple-system,sans-serif" font-size="23" font-weight="800" letter-spacing="-0.5">
          <tspan fill="#0D9488">F</tspan><tspan fill="#D4883A">a</tspan><tspan fill="#0D9488">stAnalyt</tspan><tspan fill="#D4883A">i</tspan><tspan fill="#0D9488">cs</tspan>
        </text>
        <text x="58" y="47" font-family="Inter,sans-serif" font-size="8.5" font-weight="600" fill="#64748B" letter-spacing="1.8">IA ESPACIOTEMPORAL PARA DECISIONES PREDICTIVAS</text>
      </svg>
      <div>
        <div id="sceneKicker">CHRONNET SHOW</div>
        <div id="sceneTitle">Portada</div>
      </div>
    </div>
    <div class="spacer"></div>
    <button class="tbtn" id="menuBtn">☰ Menú</button>
    <button class="tbtn" id="langBtn">EN</button>
    <button class="tbtn" id="sndBtn">🔇</button>
    <button class="tbtn" id="fsBtn">⛶</button>
  </div>

  <div id="main">
    <!-- ============ PORTADA / MENÚ ============ -->
    <div id="menu" class="open">
      <h1>La red del lavado, <span class="a">construida y disruptada</span> ante tus ojos</h1>
      <p class="sub" data-es="Ayudas audiovisuales del taller «Construcción y analítica de redes criminales». Cuatro conceptos explicados como la máquina los ejecuta —sin fórmulas— y cuatro escenas con el dataset real de reportes SAR (FinCEN/ICIJ). Controles de presentador: pausa, avance paso a paso y barra de tiempo."
         data-en="Audiovisual aids for the workshop “Construction and Analytics of Criminal Networks”. Four concepts explained as the machine executes them —no formulas— and four scenes on the real SAR dataset (FinCEN/ICIJ). Presenter controls: pause, step forward and a timeline scrubber."></p>
      <div class="mgrid" id="mgrid"></div>
      <p class="sub" style="margin-top:26px;font-size:12px" data-es="Dataset: 4.507 reportes SAR · 1.726 bancos · 129 países · 2010–2015. Escenas 2, 4, 6 y 8 usan los 48 bancos de mayor monto. Flechas del teclado ← → para avanzar o retroceder."
         data-en="Dataset: 4,507 SAR filings · 1,726 banks · 129 countries · 2010–2015. Scenes 2, 4, 6 and 8 use the top 48 banks by amount. Keyboard arrows ← → to step back or forward."></p>
    </div>

    <!-- ============ ESCENARIO ============ -->
    <div id="stageWrap">
      <div id="canvasBox">
        <canvas id="cv"></canvas>
        <div id="hints">← → paso · espacio pausa · F pantalla completa</div>
      </div>
      <div id="simbar"></div>
      <div id="controls">
        <div id="caption"><span class="stepno"></span><span id="capText"></span></div>
        <div id="chipRow"></div>
        <div id="ctrlRow">
          <button class="cbtn ghost" id="prevBtn" title="Paso anterior">⏮</button>
          <button class="cbtn" id="playBtn" title="Pausa / reproducir">⏸</button>
          <button class="cbtn ghost" id="nextBtn" title="Paso siguiente">⏭</button>
          <div id="prog"><div id="progFill"></div><div id="progDot"></div></div>
          <div id="stepCount">0 / 0</div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
